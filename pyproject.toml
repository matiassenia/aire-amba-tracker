[project]
name = "environmental-intelligence-platform"
version = "0.1.0"
description = "Modular environmental intelligence backend for AireBA."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17.2",
  "fastapi>=0.122.0",
  "geoalchemy2>=0.17.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.0.44",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=9.0.1",
  "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "postgis: integration tests that require PostgreSQL with PostGIS",
]
